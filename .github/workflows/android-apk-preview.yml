name: Android APK preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-preview-main
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build KinShield Android APK & Publish Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api-core.kinshield.click/api' }}
      EXPO_PUBLIC_WS_URL: ${{ vars.EXPO_PUBLIC_WS_URL || 'https://api-core.kinshield.click' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build Android APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Sign release APK (consistent keystore if configured) & compute SHA-256
        id: prepare_apk
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk_source="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_source" ]]; then
            echo "::error::Không tìm thấy file APK tại $apk_source"
            exit 1
          fi

          out_apk="$RUNNER_TEMP/KinShield.apk"
          cp "$apk_source" "$out_apk"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            keystore_path="$RUNNER_TEMP/kinshield-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"

            build_tools_dir="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
            aligned_apk="$RUNNER_TEMP/KinShield-aligned.apk"
            "$build_tools_dir/zipalign" -f -p 4 "$out_apk" "$aligned_apk"
            "$build_tools_dir/apksigner" sign \
              --ks "$keystore_path" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$out_apk" \
              "$aligned_apk"
            "$build_tools_dir/apksigner" verify --verbose "$out_apk"
            rm -f "$keystore_path" "$aligned_apk"
            echo "signing_mode=Release Keystore (V2/V3 verified)" >> "$GITHUB_OUTPUT"
          else
            echo "signing_mode=Preview Debug Key (cấu hình 4 GitHub Secrets ANDROID_KEYSTORE_* để ký cố định)" >> "$GITHUB_OUTPUT"
          fi

          sha256sum "$out_apk" | awk '{print $1}' > "$RUNNER_TEMP/KinShield.apk.sha256"
          apk_sha256="$(cat "$RUNNER_TEMP/KinShield.apk.sha256")"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$out_apk"

      - name: Publish APK to GitHub Releases (preview-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="preview-latest"
          apk_file="$RUNNER_TEMP/KinShield.apk"
          sha_file="$RUNNER_TEMP/KinShield.apk.sha256"
          short_sha="${GITHUB_SHA:0:12}"
          notes=$(printf 'Bản cài đặt Android **KinShield** tự động build từ nhánh `main`.\n\n- **Tên ứng dụng:** `KinShield` (`click.kinshield.mobile`)\n- **Commit:** `%s`\n- **Chữ ký APK:** %s\n- **SHA-256:** `%s`\n- **API URL:** `%s`\n- **Kiến trúc:** `arm64-v8a` (điện thoại Android thật)\n\nTải file `KinShield.apk` bên dưới để cài đặt.' "$short_sha" "${{ steps.prepare_apk.outputs.signing_mode }}" "${{ steps.prepare_apk.outputs.apk_sha256 }}" "$EXPO_PUBLIC_API_URL")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_file" "$sha_file" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "KinShield Android (APK)" --notes "$notes"
          else
            gh release create "$tag" "$apk_file" "$sha_file" \
              --target "$GITHUB_SHA" \
              --title "KinShield Android (APK)" \
              --prerelease \
              --notes "$notes"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinShield-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/KinShield.apk
            ${{ runner.temp }}/KinShield.apk.sha256
          retention-days: 14

      - name: Write APK download summary
        shell: bash
        run: |
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/preview-latest/KinShield.apk"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/preview-latest"
          {
            printf -- '## KinShield · Android APK Release\n\n'
            printf -- '- **Commit:** `%s`\n' "${GITHUB_SHA:0:12}"
            printf -- '- **Chữ ký:** %s\n' "${{ steps.prepare_apk.outputs.signing_mode }}"
            printf -- '- **SHA-256:** `%s`\n' "${{ steps.prepare_apk.outputs.apk_sha256 }}"
            printf -- '- **Tải trực tiếp `.apk`:** [KinShield.apk](%s)\n' "$download_url"
            printf -- '- **Trang GitHub Release:** [preview-latest](%s)\n' "$release_url"
          } >> "$GITHUB_STEP_SUMMARY"
