name: Expo Go preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-go-preview-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EAS_CLI_VERSION: "27.11.0"
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}

    steps:
      - name: Check Expo settings
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo '::error::Set the EXPO_TOKEN Actions secret. See .github/expo-go-preview.md.'
            exit 1
          fi

          if [[ ! "$EXPO_PROJECT_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo '::error::Set the EXPO_PROJECT_ID Actions variable to the Expo project UUID.'
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api-core.kinshield.click/api' }}
        run: |
          # Liên kết bản checkout với project Expo của team để EAS biết nơi publish.
          npx --yes "eas-cli@$EAS_CLI_VERSION" project:init \
            --id "$EXPO_PROJECT_ID" --non-interactive --no-icon

          npx --yes "eas-cli@$EAS_CLI_VERSION" update \
            --branch expo-go-preview \
            --environment preview \
            --platform all \
            --message "main @ ${GITHUB_SHA:0:12}" \
            --non-interactive --json > "$RUNNER_TEMP/expo-go-update.json"

      - name: Share Expo Go QR code
        shell: bash
        run: |
          # Chỉ chia sẻ QR khi cả hai nền tảng được publish cùng nhóm và đúng runtime Expo Go.
          sdk_version=$(npx --no-install expo config --type public --json | jq -er '.sdkVersion')
          group_id=$(jq -er --arg runtime "exposdk:$sdk_version" '
            select((map(.platform) | sort) == ["android", "ios"])
            | select(all(.[]; .runtimeVersion == $runtime))
            | map(.group) | unique | select(length == 1) | .[0]
            | select(type == "string" and test("^[0-9a-fA-F-]{36}$"))
          ' "$RUNNER_TEMP/expo-go-update.json") || {
            echo '::error::EAS did not return one Android/iOS update group with the Expo Go runtime.'
            exit 1
          }

          qr_url="https://qr.expo.dev/eas-update?slug=exp&projectId=$EXPO_PROJECT_ID&groupId=$group_id"
          {
            printf '## KinShield Mobile trên Expo Go\n\n'
            printf 'Commit `%s` · Expo SDK `%s`\n\n' "$GITHUB_SHA" "$sdk_version"
            printf '![QR mở bản preview bằng Expo Go](%s)\n\n' "$qr_url"
            printf '[Mở ảnh QR](%s) · [Tải Expo Go đúng SDK](https://expo.dev/go)\n' "$qr_url"
          } >> "$GITHUB_STEP_SUMMARY"
